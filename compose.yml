services:
  web:
    build: ./web
    ports:
      - "8094:80"
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8093:80"
    volumes:
      - ./api:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db_data:
