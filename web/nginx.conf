server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    location /api/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
